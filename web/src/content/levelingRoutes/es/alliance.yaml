lang: es
translationKey: alliance
slug: alliance
title: 'Ruta de leveleo 1–60 para Alianza en WoW Forever'
description: >-
  Ruta completa de 1 a 60 para Alianza en World of Warcraft: Forever, por tramos, con las
  mazmorras que merecen la pena en cada uno.
updated: 2026-09-21
faction: alliance
sources:
  - label: 'Blizzard — Discover What’s Next: WoW at BlizzCon 2026'
    url: https://worldofwarcraft.blizzard.com/en-us/news/24301145
segments:
  - from: 1
    to: 10
    zones: []
    dungeons: []
    steps:
      - id: lvl-alliance-001
        from: 1
        to: 10
        action: >-
          Termina la zona inicial de tu raza sin saltarte misiones: es el tramo más rápido del juego y
          te deja el equipo básico.
      - id: lvl-alliance-002
        from: 1
        to: 10
        action: >-
          Aprende tus dos profesiones y las tres secundarias antes de salir. Cocina y Primeros auxilios
          no ocupan hueco.
  - from: 10
    to: 20
    zones: [westfall, loch-modan, darkshore]
    dungeons: [deadmines]
    steps:
      - id: lvl-alliance-003
        from: 10
        to: 20
        action: >-
          Westfall entero: la cadena de los Defias es la columna del tramo.
      - id: lvl-alliance-004
        from: 10
        to: 20
        action: >-
          Deadmines con grupo en cuanto tengas 17. Sale equipo que te dura hasta los 25.
      - id: lvl-alliance-005
        from: 10
        to: 20
        action: >-
          Loch Modan o Darkshore para rematar, según dónde empezaras.
  - from: 20
    to: 30
    zones: [redridge-mountains, duskwood, wetlands, ashenvale]
    dungeons: [stockade, gnomeregan]
    steps:
      - id: lvl-alliance-006
        from: 20
        to: 30
        action: >-
          Redridge y Duskwood seguidas: se encadenan solas y están pegadas.
      - id: lvl-alliance-007
        from: 20
        to: 30
        action: >-
          Wetlands cuando se acaben las misiones de tu nivel. Cuidado en el camino.
      - id: lvl-alliance-008
        from: 20
        to: 30
        action: >-
          Gnomeregan con grupo sobre los 27. Es largo, así que ve con tiempo.
  - from: 30
    to: 40
    zones: [stranglethorn-vale, arathi-highlands, desolace, dustwallow-marsh, alterac-mountains]
    dungeons: [scarlet-monastery, razorfen-downs, uldaman]
    steps:
      - id: lvl-alliance-009
        from: 30
        to: 40
        action: >-
          Stranglethorn de arriba abajo: es la zona que más misiones tiene de todo el tramo. Si te
          cansa, alterna con Arathi.
      - id: lvl-alliance-010
        from: 30
        to: 40
        action: >-
          Scarlet Monastery en cuanto puedas montar grupo. Cementerio, Biblioteca y Armería dan más
          experiencia por hora que cualquier misión.
      - id: lvl-alliance-011
        from: 30
        to: 40
        action: >-
          Cierra el tramo con Desolace o Dustwallow, según de qué lado del mar estés.
  - from: 40
    to: 50
    zones: [tanaris, feralas, badlands, the-hinterlands, searing-gorge]
    dungeons: [zul-farrak, maraudon, sunken-temple]
    steps:
      - id: lvl-alliance-012
        from: 40
        to: 50
        action: >-
          Tanaris con base en Gadgetzan. Coge todas las misiones antes de salir del pueblo.
      - id: lvl-alliance-013
        from: 40
        to: 50
        action: >-
          Feralas en paralelo: es la zona más rentable del tramo si vas solo.
      - id: lvl-alliance-014
        from: 40
        to: 50
        action: >-
          Zul’Farrak y Sunken Temple con grupo. Uldaman si te falta equipo.
  - from: 50
    to: 60
    zones:
      [
        un-goro-crater,
        felwood,
        western-plaguelands,
        eastern-plaguelands,
        winterspring,
        burning-steppes,
        silithus,
      ]
    dungeons: [blackrock-depths, dire-maul, stratholme, scholomance, ubrs]
    steps:
      - id: lvl-alliance-015
        from: 50
        to: 60
        action: >-
          Un’Goro primero: misiones densas y, si llevas Desuello, el mejor sitio del juego para cuero.
      - id: lvl-alliance-016
        from: 50
        to: 60
        action: >-
          Tierras de la Peste occidentales y luego orientales. Es el tramo que te deja listo para raid.
      - id: lvl-alliance-017
        from: 50
        to: 60
        action: >-
          Blackrock Depths en grupo desde 52: da experiencia, equipo y la llave de lo que viene después.
      - id: lvl-alliance-018
        from: 50
        to: 60
        action: >-
          Remata con Winterspring o Silithus si te faltan niveles. Stratholme y Scholomance cuando
          llegues a 58.
