name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'http://localhost:4321' }}

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore api/WowCompanion.sln

      - name: Build
        run: dotnet build api/WowCompanion.sln -c Release --no-restore

  addon:
    name: Addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 5.1 is the game's interpreter. 5.4 accepts escapes 5.1 silently mangles, so
      # checking against it let a `\u{2022}` reach players' screens as `u{2022}`.
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1

      - name: Check every module compiles
        run: luac5.1 -p addon/WowForeverCompanion/*.lua addon/WowForeverCompanion/Guides/*.lua

      - name: Lint escapes and the toc
        run: cd addon && lua5.1 tests/lint.lua

      - name: Test the pure logic
        run: cd addon && lua5.1 tests/run.lua

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [web, api, addon]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build web api
