server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # URLs carry no trailing slash; pages are built as <path>/index.html.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Hashed build assets can be cached forever; HTML must not be.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
