services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${PROXY_PORT:-8080}:8080'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
        # Empty on purpose: the browser reaches the API through the proxy, same origin.
        PUBLIC_API_URL: ''
    restart: unless-stopped
    expose:
      - '80'

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedOrigins: ${PUBLIC_SITE_URL:-http://localhost:8080}
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-wowcompanion};Username=${POSTGRES_USER:-wowcompanion};Password=${POSTGRES_PASSWORD:-change-me-in-production}
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wowcompanion}
      POSTGRES_USER: ${POSTGRES_USER:-wowcompanion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wowcompanion}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
